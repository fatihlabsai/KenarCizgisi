<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kenar Çizgisi</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ana menü: arkada antrenman sahası oynar -->
  <section id="ekran-menu" class="ekran">
    <canvas class="tuval tuval-kapla" id="tuval-menu"></canvas>
    <div class="menu-karartma"></div>
    <div class="menu-icerik">
      <h1 class="logo">KENAR ÇİZGİSİ</h1>
      <p class="logo-alt">Carceria · 2026</p>
      <nav class="menu-dugmeler" id="menu-dugmeler"></nav>
    </div>
    <p class="menu-surum" id="menu-surum"></p>
  </section>

  <!-- Yeni kariyer: menajerin adı ve memleketi -->
  <section id="ekran-yeni" class="ekran kagit-ekran" hidden>
    <div class="kagit">
      <h2>Yeni kariyer</h2>
      <p class="soluk">Kalvar Spor teknik direktör arıyor. Dosyanı doldur.</p>
      <div class="alanlar">
        <label>Adın <input id="yeni-ad" maxlength="18" autocomplete="off" spellcheck="false"></label>
        <label>Soyadın <input id="yeni-soyad" maxlength="18" autocomplete="off" spellcheck="false"></label>
      </div>
      <p class="etiket">Nerelisin?</p>
      <div class="memleketler" id="yeni-memleket"></div>
      <p class="hata" id="yeni-hata"></p>
      <div class="dugme-satiri">
        <button class="dugme ikincil" id="yeni-geri">Geri</button>
        <button class="dugme" id="yeni-devam">Devam</button>
      </div>
    </div>
  </section>

  <!-- Karakter oluşturma: menajerin görünüşü -->
  <section id="ekran-gorunus" class="ekran kagit-ekran" hidden>
    <div class="kagit gorunus-kagit">
      <h2>Görünüşün</h2>
      <p class="soluk">Kulüpte ilk gün seni böyle görecekler.</p>
      <div class="gorunus-izgara">
        <div class="onizleme">
          <canvas class="tuval" id="gorunus-buyuk"></canvas>
          <div class="onizleme-alt">
            <canvas class="tuval" id="gorunus-saha"></canvas>
            <div><b id="gorunus-ad"></b><span>Kalvar Spor · Teknik direktör</span></div>
          </div>
        </div>
        <div class="secimler" id="gorunus-secimler"></div>
      </div>
      <div class="dugme-satiri gorunus-dugmeler">
        <button class="dugme ikincil" id="gorunus-rastgele">Rastgele</button>
        <span class="bosluk"></span>
        <button class="dugme ikincil" id="gorunus-geri">Geri</button>
        <button class="dugme" id="gorunus-devam">Başvur</button>
      </div>
    </div>
  </section>

  <!-- Kulübün teklif mektubu -->
  <section id="ekran-mektup" class="ekran kagit-ekran" hidden>
    <div class="kagit mektup">
      <div class="mektup-ust"><span>KALVAR SPOR KULÜBÜ</span><span id="mektup-tarih"></span></div>
      <div id="mektup-metin"></div>
      <div class="dugme-satiri">
        <button class="dugme ikincil" id="mektup-geri">Vazgeç</button>
        <button class="dugme" id="mektup-imza">İmzala</button>
      </div>
    </div>
  </section>

  <!-- Oyun -->
  <section id="ekran-oyun" class="ekran" hidden>
    <header class="hud">
      <div class="hud-kulup"><span class="forma-rengi"></span><span id="hud-kulup"></span></div>
      <div class="hud-tarih" id="hud-tarih"></div>
      <div class="hud-sag">
        <div class="hud-olcu" title="Enerji"><span>Enerji</span><div class="olcu"><i id="hud-enerji"></i></div><b id="hud-enerji-yazi"></b></div>
        <div class="hud-olcu stres" title="Stres"><span>Stres</span><div class="olcu"><i id="hud-stres"></i></div><b id="hud-stres-yazi"></b></div>
        <div class="hud-para" id="hud-para"></div>
      </div>
    </header>
    <main class="oyun-orta">
      <div class="oyun-sahne"><div class="sahne-cerceve"><canvas class="tuval" id="tuval-oyun"></canvas></div></div>
      <aside class="gundem kagit" id="gundem"></aside>
    </main>
    <footer class="hud-alt">
      <span class="soluk" id="hud-yer"></span>
      <div class="dugme-satiri">
        <button class="dugme ikincil" id="oyun-menu">Menü (Esc)</button>
        <button class="dugme ikincil" id="oyun-gazeteler">Gazeteler</button>
        <button class="dugme ikincil" id="oyun-lig">Lig</button>
        <button class="dugme ikincil" id="oyun-transfer">Transfer</button>
        <button class="dugme ikincil" id="oyun-kadro">Kadro</button>
        <button class="dugme ikincil" id="oyun-harita">Harita (M)</button>
      </div>
    </footer>
  </section>

  <!-- Maç -->
  <section id="ekran-mac" class="ekran" hidden>
    <header class="skorbord">
      <div class="sb-takim sb-ev"><span class="sb-renk" id="sb-ev-renk"></span><span id="sb-ev-ad"></span></div>
      <div class="sb-skor"><b id="sb-skor">0 - 0</b><span id="sb-dk">0'</span></div>
      <div class="sb-takim sb-dep"><span id="sb-dep-ad"></span><span class="sb-renk" id="sb-dep-renk"></span></div>
    </header>
    <main class="mac-orta">
      <div class="mac-sahne"><div class="sahne-cerceve"><canvas class="tuval" id="tuval-mac"></canvas></div></div>
      <aside class="mac-yan kagit">
        <div class="mac-istat" id="mac-istat"></div>
        <ol class="mac-akis" id="mac-akis"></ol>
      </aside>
    </main>
    <footer class="mac-alt">
      <div class="secenekler" id="mac-hiz"></div>
      <div class="dugme-satiri">
        <button class="dugme ikincil" id="mac-bagir">Bağır</button>
        <button class="dugme ikincil" id="mac-taktik">Taktik (Esc)</button>
        <button class="dugme" id="mac-sonuc">Sonuca geç</button>
      </div>
    </footer>
  </section>

  <!-- Her ekranın üstüne açılan büyük kâğıt: taktik, kadro, basın, gazete, lig, transfer -->
  <div id="oyun-tam" class="oyun-tam" hidden><div class="kagit tam-kagit" id="oyun-tam-icerik"></div></div>

  <!-- Açılır pencere (kayıtlar, ayarlar, duraklatma) -->
  <div id="pencere" class="pencere-arka" hidden>
    <div class="pencere kagit">
      <h2 id="pencere-baslik"></h2>
      <div id="pencere-govde"></div>
      <div class="dugme-satiri" id="pencere-dugmeler"></div>
    </div>
  </div>

  <script src="js/kaynak.js"></script>
  <script src="js/karakter.js"></script>
  <script src="js/veri.js"></script>
  <script src="js/dunya.js"></script>
  <script src="js/sahne-antrenman.js"></script>
  <script src="js/sahne-sokak.js"></script>
  <script src="js/sahne-daire.js"></script>
  <script src="js/sahne-mac.js"></script>
  <script src="js/sehir.js"></script>
  <script src="js/sahne-dunya.js"></script>
  <script src="js/depo.js"></script>
  <script src="js/cizici.js"></script>
  <script src="js/arayuz.js"></script>
  <script src="js/gorunus.js"></script>
  <script src="js/mac-motoru.js"></script>
  <script src="js/mac-ekrani.js"></script>
  <script src="js/antrenman.js"></script>
  <script src="js/lig.js"></script>
  <script src="js/yonetim.js"></script>
  <script src="js/sozlesme.js"></script>
  <script src="js/transfer.js"></script>
  <script src="js/hafta.js"></script>
  <script src="js/kadro.js"></script>
  <script src="js/taktik.js"></script>
  <script src="js/basin.js"></script>
  <script src="js/gazete.js"></script>
  <script src="js/ekonomi.js"></script>
  <script src="js/yasam.js"></script>
  <script src="js/harita.js"></script>
  <script src="js/oyun.js"></script>
  <script src="js/ana.js"></script>
</body>
</html>
